name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp service worker cache version with commit SHA
        run: sed -i "s/a8e-v1/a8e-${GITHUB_SHA::8}/" jsA8E/sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (repo root, so jsA8E/ can fetch ../ATARIXL.ROM and ../roms/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
